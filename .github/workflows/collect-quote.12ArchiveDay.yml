name: collect-quote.12ArchiveDay
on:
  workflow_dispatch:
    inputs:
      codes:
        description: "仅处理指定证券（逗号分隔，留空=全部）"
        required: false
        default: ""
  schedule:
    - cron: "20 16 * * 2,3,4,5,6,0"
concurrency:
  group: quote-all
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: collect-quote
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r .github/Python/Quote/requirements.txt
      - name: ConfigureGitIdentity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: RunTask02ArchiveDaily
        env:
          QUOTE_CODES: ${{ github.event.inputs.codes }}
        run: python .github/Python/Quote/Task02ArchiveDaily.py
      # Task02 已在上一步独立完成 add/commit/push; Task12 走 Contents API 直写远端,
      # 不产生本地 commit, 两个任务严格串行、递交互不影响
      - name: RunTask12ArchiveDaily
        env:
          QUOTE_CODES: ${{ github.event.inputs.codes }}
          GITHUB_TOKEN: ${{ secrets.GIT_COMMIT_TOKEN }}
          # 分支拆两个 (同一仓库), 不跟随触发 ref: workflow_dispatch 从 Actions 页面
          # 触发时默认是仓库默认分支 dev
          #   - 当前处理分支: Latest.mvsv 的读取与回填/裁剪写回, 与 checkout 的 ref 一致
          #   - 日归档目标分支: 按日切分后的归档 .mvsv 写入分支
          QUOTE_SOURCE_BRANCH: collect-quote
          QUOTE_ARCHIVE_BRANCH: archive-quote
        run: python .github/Python/Quote/Task12ArchiveDaily.py
      - name: VerifyCleanPush
        run: |
          git log origin/collect-quote..HEAD --oneline | (! read)
          git status --short | (! read)
